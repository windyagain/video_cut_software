[package]
name = "desktop"
version = "0.1.0"
description = "Video Cut Desktop"
authors = ["pxy"]
edition = "2021"

[lib]
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
video_engine = { path = "../../../crates/video_engine" }
